limit_req_zone $binary_remote_addr zone=simf_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=simf_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=simf_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name sim.startime.sa www.sim.startime.sa;

    server_tokens off;
    client_max_body_size 70m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;
    # HTTP/2 counts concurrent requests independently. Image-heavy pages can
    # legitimately exceed 30 while loading without representing abusive use.
    limit_conn simf_connections 120;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/cms-users/login {
        limit_req zone=simf_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        limit_req zone=simf_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_hide_header X-Powered-By;
    }
}
