services:
  simf-client-preview:
    container_name: simf-client-preview
    build:
      context: .
      dockerfile: Dockerfile.preview
      args:
        NEXT_PUBLIC_APP_URL: https://simf-staging.startime.sa
        NEXT_PUBLIC_ALLOW_INDEXING: "false"
      secrets:
        - payload_secret
    restart: unless-stopped
    ports:
      - "127.0.0.1:3014:3000"
    env_file:
      - .env.preview
    environment:
      DATABASE_URL: file:/data/simf.db
      NEXT_PUBLIC_APP_URL: https://simf-staging.startime.sa
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
      MEDIA_UPLOAD_DIR: /data/uploads/media
      FORM_UPLOAD_DIR: /data/uploads/form-uploads
    volumes:
      - ./data:/data

secrets:
  payload_secret:
    environment: PAYLOAD_SECRET
